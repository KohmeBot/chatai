<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatAI · Agent 运行台</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#191c22;--line:#2c303a;--text:#e7eaf1;--muted:#929baa;--accent:#a8e6cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}h1{font-size:18px;margin:0;letter-spacing:.3px}.brand{color:var(--accent);margin-right:12px}small,.muted{color:var(--muted)}button,input,select{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}main{padding:28px 32px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h2{font-size:25px;margin:0 0 4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{padding:18px 22px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.stat strong{display:block;font-size:28px;font-weight:550;margin-top:4px}.filters{display:flex;gap:10px;margin-bottom:16px}.filters input{flex:1}.layout{display:grid;grid-template-columns:minmax(370px,1fr) minmax(420px,1.15fr);gap:20px;align-items:start}.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.panel-title{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.runs{max-height:70vh;overflow:auto}.run{display:block;border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;text-align:left;padding:18px 20px;background:transparent}.run.selected{background:#22312e;box-shadow:inset 3px 0 var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.prompt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin:10px 0;font-size:15px}.meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.badge{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;background:#29303b;color:#cbd4e2}.success{background:#203b32;color:#a8e6cf}.error{background:#40262d;color:#ffb2c1}.running{background:#363522;color:#ede4a0}#detail{max-height:82vh;overflow:auto;position:sticky;top:20px}.detail-body{padding:20px}.timeline{margin-top:24px}.event{position:relative;padding:0 0 23px 24px;border-left:1px solid #3b4450;margin-left:5px}.event:before{content:"";position:absolute;left:-5px;top:6px;width:9px;height:9px;border-radius:50%;background:#80909f}.event.skill:before{background:#c1a5fc}.event.tool:before{background:var(--accent)}.event.failed:before{background:#ff9db5}.event:last-child{border-left-color:transparent}.event-title{font-weight:550}.event-time{font-size:11px;color:var(--muted);margin:4px 0 9px}details{margin-top:9px;border:1px solid var(--line);border-radius:7px;background:#14171c}summary{padding:8px 12px;cursor:pointer;color:#b8c4d5;font-size:12px}pre{font:12px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;margin:0;border-top:1px solid var(--line);max-height:380px;overflow:auto}.empty{padding:65px 25px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:8px;font-size:17px}.warning{color:#edc68d;font-size:12px}.login{max-width:430px;margin:12vh auto;padding:32px}.login input{width:100%;margin:20px 0 14px}.primary{background:var(--accent);color:#163027;border-color:var(--accent)}[hidden]{display:none!important}#connection{font-size:12px;margin-right:15px}#login-error{color:#ffb2c1}footer{font-size:12px;color:var(--muted);margin-top:18px}@media(max-width:1000px){.layout{grid-template-columns:1fr}#detail{position:static;max-height:none}.runs{max-height:450px}}@media(max-width:600px){header{padding:0 16px}main{padding:20px 16px}.stats{grid-template-columns:1fr 1fr}.filters{flex-wrap:wrap}.filters input{min-width:100%}.intro{display:block}.login{margin:8vh 16px}.stat{padding:14px}}
</style></head><body>
<header><h1><span class="brand">◈ ChatAI</span> Agent 运行台</h1><div><span id="connection" class="muted">尚未连接</span><button id="logout" hidden>退出</button></div></header>
<section id="login" class="panel login"><h2>连接运行台</h2><p class="muted">输入监控访问口令，查看 Agent 实时执行过程。</p><form id="login-form"><label for="token">访问口令</label><input id="token" type="password" autocomplete="current-password" required placeholder="monitor.access_token"><button class="primary" type="submit">连接并查看</button><p id="login-error" role="alert"></p></form></section>
<main id="app" hidden><div class="intro"><div><h2>每一次决策，都有迹可循。</h2><span class="muted">观察模型调用、Skills 加载与工具执行的完整顺序。</span></div><small>AGENT OBSERVABILITY / LIVE</small></div>
<section class="stats" aria-label="当前保留记录统计"><div class="stat"><small>保留的对话</small><strong id="total">0</strong></div><div class="stat"><small>正在运行</small><strong id="active">0</strong></div><div class="stat"><small>运行错误</small><strong id="errors">0</strong></div><div class="stat"><small>总 Token · 输入 + 输出</small><strong id="tokens">0</strong></div></section>
<div class="filters"><input id="query" aria-label="搜索" placeholder="搜索触发语句、群号、用户或模型…"><select id="status" aria-label="状态"><option value="">全部状态</option><option value="running">运行中</option><option value="success">成功</option><option value="error">错误</option></select><button id="refresh">刷新</button></div>
<div class="layout"><section class="panel"><div class="panel-title"><strong>对话记录</strong><small id="count"></small></div><div id="runs" class="runs"></div></section><section class="panel" id="detail"><div class="empty"><strong>选择一轮对话</strong>在左侧打开记录，查看 Agent Loop 时间线。</div></section></div><footer>记录保存在当前进程内存，重启后清空；详情有容量上限。仅展示模型接口实际返回的推理内容。</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),labels={running:'运行中',success:'成功',error:'错误'};
let runs=[],selected='',source=null,loading=false,again=false,detailSerial=0,authenticated=false;
const number=n=>Number(n||0).toLocaleString('zh-CN'),duration=n=>n<1000?`${n||0} ms`:`${(n/1000).toFixed(1)} s`,time=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function badge(status){return el('span',`badge ${status}`,labels[status]||status)}
async function api(url,options){const r=await fetch(url,options);if(r.status===401){disconnect();throw Error('访问口令无效或会话已失效')}if(!r.ok)throw Error(r.status===404?'记录已超出保留范围':`请求失败 (${r.status})`);return r.status===204?null:r.json()}
function disconnect(){authenticated=false;if(source)source.close();source=null;$('app').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('connection').textContent='尚未连接';}
function connect(){authenticated=true;$('login').hidden=true;$('app').hidden=false;$('logout').hidden=false;if(source)source.close();source=new EventSource('/api/events');source.onopen=()=>{$('connection').textContent='● 实时连接';refresh()};source.onmessage=()=>refresh();source.onerror=()=>{$('connection').textContent='连接中断 · 正在重连'};refresh()}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/session',{method:'POST',headers:{Authorization:'Bearer '+$('token').value}});$('token').value='';$('login-error').textContent='';connect()}catch(e){$('login-error').textContent=e.message}};
$('logout').onclick=async()=>{try{await api('/api/session',{method:'DELETE'})}finally{disconnect()}};
async function refresh(){if(!authenticated)return;if(loading){again=true;return}loading=true;try{runs=await api('/api/runs');renderRuns();if(selected)await showDetail(selected)}catch(e){$('connection').textContent=e.message}finally{loading=false;if(again){again=false;setTimeout(refresh,200)}}}
function renderRuns(){const q=$('query').value.toLowerCase(),status=$('status').value;const visible=runs.filter(r=>(!status||r.status===status)&&[r.prompt,r.group_id,r.user_id,r.user_name||"",r.model].some(v=>v.toLowerCase().includes(q)));$('total').textContent=number(runs.length);$('active').textContent=number(runs.filter(r=>r.status==='running').length);$('errors').textContent=number(runs.filter(r=>r.status==='error').length);$('tokens').textContent=number(runs.reduce((n,r)=>n+r.input_tokens+r.output_tokens,0));$('count').textContent=visible.length+' 条';const root=$('runs');root.replaceChildren();if(!visible.length){const empty=el('div','empty');empty.append(el('strong','',runs.length?'没有符合条件的记录':'等待第一轮 Agent 调用'),el('span','',runs.length?'调整搜索条件后重试。':'启用监控后，新触发的对话会自动出现在这里。'));root.append(empty);return}for(const r of visible){const b=el('button','run'+(r.id===selected?' selected':''));b.setAttribute('aria-pressed',r.id===selected);const row=el('div','row');row.append(el('small','',`#${r.id} · ${time(r.started_at)}`),badge(r.status));b.append(row,el('div','prompt',r.prompt||'事件触发'));const meta=el('div','meta');for(const text of [`群 ${r.group_id}`,`用户 ${r.user_name?r.user_name+" · ":""}${r.user_id}`,r.model,`${number(r.input_tokens+r.output_tokens)} token`,duration(r.duration_ms)])meta.append(el('span','',text));b.append(meta);b.onclick=()=>{selected=r.id;renderRuns();showDetail(r.id).catch(e=>{$('detail').replaceChildren(el('div','empty',e.message))})};root.append(b)}}
function disclosure(title,text,key,opened){const d=el('details');d.dataset.key=key;d.open=opened.has(key);d.append(el('summary','',title),el('pre','',text));return d}
function pretty(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value}}
async function showDetail(id){const serial=++detailSerial;let r;try{r=await api('/api/runs/'+encodeURIComponent(id))}catch(e){if(id===selected&&serial===detailSerial)$('detail').replaceChildren(el('div','empty',e.message));return}if(id!==selected||serial!==detailSerial)return;const root=$('detail'),scroll=root.scrollTop,opened=new Set([...root.querySelectorAll('details[open]')].map(e=>e.dataset.key));root.replaceChildren();const head=el('div','panel-title');head.append(el('strong','',`#${r.id} · Agent Loop`),badge(r.status));const body=el('div','detail-body');body.append(el('div','meta',`群 ${r.group_id} / 用户 ${r.user_name?r.user_name+" · ":""}${r.user_id}`),el('p','',r.model),el('div','meta',`${time(r.started_at)} · ${duration(r.duration_ms)} · 输入 ${number(r.input_tokens)} / 输出 ${number(r.output_tokens)} token`));if(r.error)body.append(el('p','warning',r.error));if(r.truncated)body.append(el('p','warning','记录达到容量上限，部分内容或后续事件已截断；统计与最终状态继续更新。'));const timeline=el('div','timeline');for(const [index,e]of(r.events||[]).entries()){let title='',cls='';switch(e.kind){case'run_started':title='User · 触发语句';break;case'model_started':title=`第 ${e.step} 轮 · 请求模型`;break;case'model_finished':title=`第 ${e.step} 轮 · 模型返回`;break;case'tool_started':title=`调用工具 · ${e.name}`;cls='tool';break;case'tool_finished':title=`${e.error?'工具失败':'工具完成'} · ${e.name}`;cls='tool';break;case'skill_loaded':title=`读取 Skill · ${e.name==='read_skill'?prettySkill(e.arguments):e.name}`;cls='skill';break;case'run_finished':title=e.error?'本轮运行失败':'本轮运行完成';break;default:title=e.kind}const item=el('div','event '+cls+(e.error?' failed':''));item.append(el('div','event-title',title),el('div','event-time',`${time(e.time)}${e.duration_ms?' · '+duration(e.duration_ms):''}${e.call_id?' · '+e.call_id:''}`));if(e.kind==='model_finished'){item.append(el('div','meta',`输入 ${number(e.input_tokens)} / 输出 ${number(e.output_tokens)} token`));if(!e.reasoning)item.append(el('small','muted','模型未返回 reasoning_content'))}for(const [key,label]of [['text',e.kind==='run_started'?'触发内容':'内容'],['reasoning','模型推理 · 供应商返回'],['arguments','工具参数'],['result','工具结果'],['error','错误详情']])if(e[key])item.append(disclosure(label,(key==='arguments'||key==='result')?pretty(e[key]):e[key],`${id}:${index}:${key}`,opened));timeline.append(item)}body.append(timeline);root.append(head,body);root.scrollTop=scroll}
function prettySkill(args){try{const a=JSON.parse(args);return a.name+(a.file?' / '+a.file:'')}catch{return'read_skill'}}
$('query').oninput=renderRuns;$('status').onchange=renderRuns;$('refresh').onclick=refresh;
// A low-frequency fallback also updates elapsed time and detects expired sessions.
setInterval(()=>{if(authenticated)refresh()},10000);
fetch('/api/runs').then(r=>{if(r.ok)connect()}).catch(()=>{});
</script></body></html>
