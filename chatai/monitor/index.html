<link rel="stylesheet" href="/glass.css"></head><body>
<header><h1><span class="brand">◈ ChatAI</span> 管理控制台</h1><div><button id="theme-toggle" type="button" aria-label="切换日夜模式"></button><span id="connection" class="muted">尚未连接</span><button id="logout" hidden>退出</button></div></header>
<section id="login" class="panel login"><h2>连接运行台</h2><p class="muted">输入监控访问口令，查看 Agent 实时执行过程。</p><form id="login-form"><label for="token">访问口令</label><input id="token" type="password" autocomplete="current-password" required placeholder="monitor.access_token"><button class="primary" type="submit">连接并查看</button><p id="login-error" role="alert"></p></form></section>
<main id="app" hidden><nav id="nav" aria-label="管理导航"><button data-view="runs" class="nav-active">◷ 运行日志</button><button data-view="skills">◇ Skills</button><button data-view="tools">⌘ Tools</button><button data-view="memory">◎ 记忆中心</button><button data-view="schedules">◷ 定时任务</button></nav><section id="run-view"><div class="intro"><div><h2>每一次决策，都有迹可循。</h2><span class="muted">观察模型调用、Skills 加载与工具执行的完整顺序。</span></div><small>AGENT OBSERVABILITY / LIVE</small></div>
<section class="stats" aria-label="当前保留记录统计"><div class="stat"><small>保留的对话</small><strong id="total">0</strong></div><div class="stat"><small>正在运行</small><strong id="active">0</strong></div><div class="stat"><small>运行错误</small><strong id="errors">0</strong></div><div class="stat"><small>总 Token · 输入 + 输出</small><strong id="tokens">0</strong></div></section>
<div class="filters"><input id="query" aria-label="搜索" placeholder="搜索触发语句、群号、用户或模型…"><select id="status" aria-label="状态"><option value="">全部状态</option><option value="running">运行中</option><option value="success">成功</option><option value="error">错误</option></select><button id="refresh">刷新</button></div>
<div class="layout"><section class="panel"><div class="panel-title"><strong>对话记录</strong><small id="count"></small></div><div id="runs" class="runs"></div></section></div><footer id="retention-note">运行记录保存在数据库中，按配置自动清理。仅展示模型接口实际返回的推理内容。</footer></section><section id="catalog-view" hidden><div class="intro"><div><h2 id="catalog-title"></h2><p id="catalog-description" class="muted"></p></div><span class="badge" id="catalog-mode">运行数据</span></div><div class="filters"><div class="group-picker"><button id="group-toggle" type="button" aria-expanded="false" aria-controls="group-options"><span id="group-identity">选择群聊</span><span aria-hidden="true">⌄</span></button><div id="group-options" class="group-options" hidden><p class="muted">按头像选择群聊</p><input id="group-search" aria-label="搜索群号" placeholder="搜索群号…"><div id="group-list" aria-label="可选群聊"></div></div></div><select id="group" aria-label="选择群聊" hidden></select><input id="catalog-query" placeholder="搜索名称、描述或内容…" aria-label="搜索当前页面"><button id="catalog-refresh">刷新数据</button></div><p id="catalog-status" role="status" class="muted"></p><div id="catalog-content"></div><div id="pagination" class="filters" hidden><button id="previous">上一页</button><span id="page-number"></span><button id="next">下一页</button></div></section></main>
<dialog id="run-dialog" class="run-dialog" aria-labelledby="run-dialog-title"><div class="run-dialog-toolbar"><div><small>CONVERSATION INSPECTOR</small><h2 id="run-dialog-title">Agent Loop · 对话详情</h2></div><button id="close-run" aria-label="关闭对话详情" autofocus>关闭 ✕</button></div><section id="detail" aria-label="运行详情"></section></dialog>
<script src="/glass-motion.js"></script><script src="/run-overview.js"></script><script src="/run-dag.js"></script><script src="/memory-ui.js"></script><script src="/schedule-ui.js"></script><script src="/catalog-ui.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),labels={running:'运行中',success:'成功',error:'错误'};
let runs=[],selected='',source=null,loading=false,again=false,detailSerial=0,authenticated=false,detailFingerprint='';
const number=n=>Number(n||0).toLocaleString('zh-CN'),duration=n=>n<1000?`${n||0} ms`:`${(n/1000).toFixed(1)} s`,time=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function badge(status){return el('span',`badge ${status}`,labels[status]||status)}
async function api(url,options){const r=await fetch(url,options);if(r.status===401){disconnect();throw Error('访问口令无效或会话已失效')}if(!r.ok)throw Error((await r.text()).trim()||`请求失败 (${r.status})`);return r.status===204?null:r.json()}
function disconnect(){ConsoleMotion.reset();document.querySelectorAll('dialog').forEach(d=>d.close());authenticated=false,detailFingerprint='';catalogSerial++;detailSerial++;runs=[];selected="";catalogData=null;$("catalog-content").replaceChildren();$("detail").replaceChildren();if(source)source.close();source=null;$('app').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('connection').textContent='尚未连接';$('connection').dataset.state='offline';}
function connect(){authenticated=true;loadGroups();api("/api/retention").then(r=>{if(authenticated)$("retention-note").textContent=r.persistent?`记录持久保存于数据库 · 保留最近 ${r.days} 天 · 到期自动清理。仅展示模型接口实际返回的推理内容。`:"当前为内存预览，重启后清空。"}).catch(()=>{});$('login').hidden=true;$('app').hidden=false;ConsoleMotion.view($(currentView==='runs'?'run-view':'catalog-view'));$('logout').hidden=false;if(source)source.close();source=new EventSource('/api/events');source.onopen=()=>{$('connection').dataset.state='live';$('connection').textContent='● 实时连接';refresh()};source.onmessage=()=>refresh();source.onerror=()=>{$('connection').dataset.state='reconnecting';$('connection').textContent='连接中断 · 正在重连'};refresh()}
$('login-form').onsubmit=async e=>{e.preventDefault();await ConsoleMotion.busy(e.submitter||$('login-form').querySelector('button'),async()=>{try{await api('/api/session',{method:'POST',headers:{Authorization:'Bearer '+$('token').value}});$('token').value='';$('login-error').textContent='';connect()}catch(e){$('login-error').textContent=e.message}})};
$('logout').onclick=async()=>{try{await api('/api/session',{method:'DELETE'})}finally{disconnect()}};
async function refresh(){if(!authenticated)return;if(loading){again=true;return}loading=true;try{const freshRuns=await api('/api/runs');if(!authenticated)return;runs=freshRuns;renderRuns();if(selected)await showDetail(selected)}catch(e){$('connection').textContent=e.message}finally{loading=false;if(again){again=false;setTimeout(refresh,200)}}}
function renderRuns(){const q=$('query').value.toLowerCase(),status=$('status').value;const visible=runs.filter(r=>(!status||r.status===status)&&[r.prompt,r.group_id,r.user_id,r.user_name||"",r.model].some(v=>v.toLowerCase().includes(q)));ConsoleMotion.stat($('total'),number(runs.length));ConsoleMotion.stat($('active'),number(runs.filter(r=>r.status==='running').length));ConsoleMotion.stat($('errors'),number(runs.filter(r=>r.status==='error').length));ConsoleMotion.stat($('tokens'),number(runs.reduce((n,r)=>n+r.input_tokens+r.output_tokens,0)));$('count').textContent=visible.length+' 条';const root=$('runs'),focusedID=root.contains(document.activeElement)?document.activeElement.dataset.runId:null;root.replaceChildren();if(!visible.length){const empty=el('div','empty');empty.append(el('strong','',runs.length?'没有符合条件的记录':'等待第一轮 Agent 调用'),el('span','',runs.length?'调整搜索条件后重试。':'启用监控后，新触发的对话会自动出现在这里。'));root.append(empty);return}for(const r of visible){const b=el('button','run'+(r.id===selected?' selected':''));b.dataset.runId=r.id;b.setAttribute('aria-pressed',r.id===selected);const row=el('div','row');row.append(el('small','',`#${r.id} · ${time(r.started_at)}`),badge(r.status));b.append(row,el('div','prompt',r.prompt||'事件触发'));const meta=el('div','meta');meta.append(identity('group',r.group_id),identity('user',r.user_id,r.user_name));for(const text of [r.model,`${number(r.input_tokens+r.output_tokens)} token`,duration(r.duration_ms)])meta.append(el('span','',text));b.append(meta);if(r.summary&&r.status==='running')b.append(el('p','stage-summary',r.summary));if(r.error)b.append(el('p','run-error-preview',r.error));b.setAttribute("aria-haspopup","dialog");b.onclick=()=>openRun(r.id);root.append(b)}ConsoleMotion.runs(root);if(focusedID)root.querySelector(`[data-run-id="${CSS.escape(focusedID)}"]`)?.focus({preventScroll:true})}
function openRun(id){detailFingerprint='';selected=id;renderRuns();$('detail').replaceChildren(el('div','empty detail-loading','正在读取完整调用链…'));$('detail').scrollTop=0;$('detail')._opened=new Set();$('detail')._dagState={};ConsoleMotion.openDialog($('run-dialog'));$('close-run').focus();showDetail(id)}
$('close-run').onclick=()=>ConsoleMotion.closeDialog($('run-dialog'));
$('run-dialog').addEventListener('close',()=>{const id=selected;selected='';detailSerial++;renderRuns();document.querySelector(`[data-run-id="${CSS.escape(id)}"]`)?.focus({preventScroll:true});$('detail').replaceChildren()});
let backdropDown=false;
$('run-dialog').addEventListener('pointerdown',e=>{backdropDown=e.target===$('run-dialog')});
$('run-dialog').addEventListener('click',e=>{if(backdropDown&&e.target===$('run-dialog'))ConsoleMotion.closeDialog($('run-dialog'));backdropDown=false});
function disclosure(title,text,key,opened){const d=el('details');d.dataset.key=key;d.open=opened.has(key);d.append(el('summary','',title),el('pre','',text));d.firstChild.dataset.focusKey=key;return d}
function pretty(value){try{return JSON.stringify(JSON.parse(value),null,2)}catch{return value}}
async function showDetail(id){const serial=++detailSerial;let r;try{r=await api('/api/runs/'+encodeURIComponent(id))}catch(e){if(id===selected&&serial===detailSerial){detailFingerprint='';$('detail').replaceChildren(el('div','empty',e.message))}return}if(id!==selected||serial!==detailSerial)return;const fingerprint=JSON.stringify(r);if(detailFingerprint===fingerprint)return;const root=$('detail'),previousView=root.querySelector('.run-inspector')?.dataset.view,focusKey=root.contains(document.activeElement)?document.activeElement.dataset.focusKey:null,oldDAG=root.querySelector('.run-dag'),dagState=oldDAG?{zoom:Number(oldDAG.dataset.zoom)||0,node:oldDAG.dataset.node}:(root._dagState||{}),dagScroll=root.querySelector('.dag-viewport'),scrollLeft=dagScroll?.scrollLeft||0,scrollTop=dagScroll?.scrollTop||0,scroll=root.scrollTop,opened=root._opened||new Set();for(const d of root.querySelectorAll('details[data-key]')){if(d.open)opened.add(d.dataset.key);else opened.delete(d.dataset.key)}root._opened=opened;root._dagState=dagState;root.replaceChildren();const head=el('div','panel-title');head.append(el('strong','',`#${r.id} · Agent Loop`),badge(r.status));const body=el('div','detail-body');const identities=el('div','meta');identities.append(identity('group',r.group_id),identity('user',r.user_id,r.user_name));const context=el('div','run-context');context.append(identities,el('span','muted',r.model),el('span','muted',time(r.started_at)));body.append(context);if(r.truncated)body.append(el('p','warning','部分长文本已截断；流程事件与时间线完整保留，统计与最终状态正常更新。'));const buildTimeline=()=>{const timeline=el('div','timeline');for(const [index,e]of(r.events||[]).entries()){let title='',cls='';switch(e.kind){case'run_started':title='User · 触发语句';break;case'model_started':title=`第 ${e.step} 轮 · 请求模型`;break;case'model_finished':title=`第 ${e.step} 轮 · 模型返回`;break;case'tool_planned':title=`规划工具 · ${e.name}`;cls='tool';break;case'tool_started':title=`调用工具 · ${e.name}`;cls='tool';break;case'tool_finished':title=`${e.error?'工具失败':'工具完成'} · ${e.name}`;cls='tool';break;case'skill_loaded':title=`读取 Skill · ${e.name==='read_skill'?prettySkill(e.arguments):e.name}`;cls='skill';break;case'run_finished':title=e.error?'本轮运行失败':'本轮运行完成';break;default:title=e.kind}const item=el('div','event '+cls+(e.error?' failed':''));item.append(el('div','event-title',title),el('div','event-time',`${time(e.time)}${e.duration_ms?' · '+duration(e.duration_ms):''}${e.call_id?' · '+e.call_id:''}`));if(e.summary)item.append(el('p','stage-summary',e.summary));if(e.kind==='model_finished'){item.append(el('div','meta',`输入 ${number(e.input_tokens)} / 输出 ${number(e.output_tokens)} token`));if(!e.reasoning)item.append(el('small','muted','模型未返回 reasoning_content'))}for(const [key,label]of [['text',e.kind==='run_started'?'触发内容':'内容'],['reasoning','模型推理 · 供应商返回'],['arguments','工具参数'],['result','工具结果'],['error','错误详情']])if(e[key])item.append(disclosure(label,(key==='arguments'||key==='result')?pretty(e[key]):e[key],`${id}:${index}:${key}`,opened));timeline.append(item)}return timeline};body.append(renderRunInspector(r,opened,previousView,{overview:()=>renderRunOverview(r,opened),flow:()=>renderRunDAG(r,dagState),outputs:()=>renderRunOverview(r,opened,'outputs'),timing:()=>renderRunTiming(r),logs:buildTimeline}));root.append(head,body);root.scrollTop=scroll;const nextDAG=root.querySelector('.dag-viewport');if(nextDAG){nextDAG.scrollLeft=scrollLeft;nextDAG.scrollTop=scrollTop}for(const d of root.querySelectorAll('details'))if(opened.has(d.dataset.key))d.open=true;root.scrollTop=scroll;if(focusKey)root.querySelector(`[data-focus-key="${CSS.escape(focusKey)}"]`)?.focus({preventScroll:true});ConsoleMotion.detail(root,id);detailFingerprint=fingerprint}
function prettySkill(args){try{const a=JSON.parse(args);return a.name+(a.file?' / '+a.file:'')}catch{return'read_skill'}}
$('query').oninput=renderRuns;$('status').onchange=renderRuns;$('refresh').onclick=()=>ConsoleMotion.busy($('refresh'),refresh);
// A low-frequency fallback also updates elapsed time and detects expired sessions.
setInterval(()=>{if(authenticated)refresh()},10000);

</script>


<script>
let currentView='runs',catalogData=null,catalogSerial=0,offset=0;
const viewInfo={schedules:['定时任务','支持一次性时间与周期 cron；按群管理任务，查看近期执行结果。'],skills:['Skills 技能库','查看当前 Agent 可检索的目录技能与已激活经验技能。'],tools:['Tools 工具目录','来自所选群的实际注册表，包含参数定义、能力分类与风险等级。'],memory:['记忆中心','短期对话按群隔离；用户简介与偏好共享，近期状态和共同经历按当前群过滤。']};
async function loadGroups(){try{const groups=await api('/api/inspect/groups');if(!authenticated)return;const old=$('group').value;$('group').replaceChildren(...groups.map(id=>{const o=el('option','',`群 ${id}`);o.value=id;return o}));if(groups.includes(old))$('group').value=old;updateGroupIdentity();if(currentView!=='runs')await loadCatalog()}catch(e){$('catalog-status').textContent=e.message}}
for(const button of $('nav').querySelectorAll('button'))button.onclick=()=>{if(currentView===button.dataset.view)return;currentView=button.dataset.view;catalogSerial++;for(const b of $('nav').querySelectorAll('button'))b.classList.toggle('nav-active',b===button);$('run-view').hidden=currentView!=='runs';$('catalog-view').hidden=currentView==='runs';ConsoleMotion.view($(currentView==='runs'?'run-view':'catalog-view'));if(currentView==='runs')return;offset=0;$('catalog-query').value='';$('catalog-mode').textContent=currentView==='memory'?'记忆管理':currentView==='schedules'?'任务管理':'只读 · 运行数据';$('catalog-title').textContent=viewInfo[currentView][0];$('catalog-description').textContent=viewInfo[currentView][1];loadCatalog()};
async function loadCatalog(){const serial=++catalogSerial;catalogData=null;$('catalog-content').replaceChildren();$('pagination').hidden=true;if(!$('group').value){$('catalog-status').textContent='暂无已启用 Agent 的群聊';return}$('catalog-status').textContent='正在读取运行数据…';try{const data=await api(`/api/inspect/${currentView}?group=${encodeURIComponent($('group').value)}&offset=${offset}`);if(serial!==catalogSerial||!authenticated)return;catalogData=data;renderCatalog();ConsoleMotion.catalog($('catalog-content'))}catch(e){if(serial===catalogSerial)$('catalog-status').textContent='读取失败：'+e.message}}
function card(title,description,tag){const c=el('article','resource-card');if(tag)c.append(el('span','badge',tag));c.append(el('h3','',title));if(description)c.append(el('p','',description));return c}
function matches(value){return JSON.stringify(value).toLowerCase().includes($('catalog-query').value.toLowerCase())}
function section(root,title,items,render){root.append(el('h3','section-heading',title));const grid=el('div','resource-grid');for(const item of items.filter(matches))grid.append(render(item));if(!grid.children.length)grid.append(el('div','empty','暂无符合条件的内容'));root.append(grid)}
function renderCatalog(){if(catalogData===null)return;const root=$('catalog-content');root.replaceChildren();$('pagination').hidden=true;const d=catalogData;
 if(currentView==='schedules'){renderSchedules(root,d);return}
 if(currentView==='skills'){renderSkills(root,d);return}
 if(currentView==='tools'){renderTools(root,d);return}
 $('catalog-status').textContent='展示当前有效记忆；过期短期摘要和过期长期记忆条目已过滤。搜索用户记忆仅作用于当前页。';
 section(root,'群长期记忆',[d.group_memory],groupMemoryCard);
 section(root,'短期对话'+(d.short_enabled?'':' · 未启用'),d.short,s=>{const c=card('用户 '+s.user_id,[s.note.summary,s.note.dialogue].filter(Boolean).join('\n\n')||'暂无摘要','短期 · 内存');identifyCard(c,'user',s.user_id);if(s.note.first_action)c.append(el('p','','续聊建议：'+s.note.first_action));c.append(el('div','meta',`更新 ${time(s.updated_at)} · 到期 ${time(s.expires_at)}`));return c});
 section(root,'用户长期记忆',d.users,userMemoryCard);$('pagination').hidden=false;$('previous').disabled=offset===0;$('next').disabled=!d.has_more;$('page-number').textContent=`第 ${offset/50+1} 页`;
}
$('catalog-query').oninput=renderCatalog;$('catalog-refresh').onclick=()=>ConsoleMotion.busy($('catalog-refresh'),loadGroups);$('group').onchange=()=>{updateGroupIdentity();offset=0;loadCatalog()};$('previous').onclick=()=>{offset=Math.max(0,offset-50);loadCatalog()};$('next').onclick=()=>{offset+=50;loadCatalog()};
fetch('/api/runs').then(r=>{if(r.ok)connect()}).catch(()=>{});
</script>

<script>initConsoleUI();ConsoleMotion.init()</script>
</body></html>
